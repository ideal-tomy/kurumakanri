<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="エンジンオイル・エレメント 費用一覧（サンプル）">
  <rect width="800" height="480" fill="#fafafa"/>
  <rect x="0" y="0" width="800" height="60" fill="#1f2937"/>
  <text x="32" y="40" font-family="sans-serif" font-size="22" font-weight="700" fill="#ffffff">エンジンオイル・エレメント 費用一覧（サンプル）</text>
  <text x="32" y="100" font-family="sans-serif" font-size="14" fill="#4b5563">※あくまで目安の参考価格です。車両状態により変動します。</text>
  <g font-family="sans-serif" font-size="16" fill="#111827">
    <line x1="32" y1="130" x2="768" y2="130" stroke="#d1d5db"/>
    <text x="32" y="160" font-weight="700">項目</text>
    <text x="768" y="160" text-anchor="end" font-weight="700">参考価格</text>
    <line x1="32" y1="180" x2="768" y2="180" stroke="#e5e7eb"/>
    <text x="32" y="210">鉱物油（4L）</text>
    <text x="768" y="210" text-anchor="end">¥4,400〜</text>
    <line x1="32" y1="230" x2="768" y2="230" stroke="#e5e7eb"/>
    <text x="32" y="260">部分合成油（4L）</text>
    <text x="768" y="260" text-anchor="end">¥6,600〜</text>
    <line x1="32" y1="280" x2="768" y2="280" stroke="#e5e7eb"/>
    <text x="32" y="310">全合成油（4L）</text>
    <text x="768" y="310" text-anchor="end">¥9,900〜</text>
    <line x1="32" y1="330" x2="768" y2="330" stroke="#e5e7eb"/>
    <text x="32" y="360">オイルエレメント交換</text>
    <text x="768" y="360" text-anchor="end">¥1,650〜</text>
    <line x1="32" y1="380" x2="768" y2="380" stroke="#e5e7eb"/>
    <text x="32" y="410">ドレンパッキン交換</text>
    <text x="768" y="410" text-anchor="end">¥220〜</text>
    <line x1="32" y1="430" x2="768" y2="430" stroke="#e5e7eb"/>
  </g>
  <text x="32" y="460" font-family="sans-serif" font-size="12" fill="#6b7280">更新: 2026年5月（サンプル画像）</text>
</svg>
